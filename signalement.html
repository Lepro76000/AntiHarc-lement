<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signalement - Anti-harcèlement</title>
  <link rel="icon" href="Anti-harcèlement.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      font-family:'Roboto', sans-serif;
      background-color:#1a1a1a;
      color:white;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .banner{
      width:100%;
      height:144px;
      background-color:#b30000;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }
    .banner img{
      height:120px;
      position:absolute;
      left:20px;
      cursor:pointer;
    }
    .banner a{
      color:white;
      text-decoration:none;
      font-weight:bold;
      font-size:18px;
      margin:0 20px;
    }
    .banner a:hover{
      text-decoration:underline;
    }
    main{
      max-width:650px;
      width:100%;
      margin:40px auto;
      padding:20px;
      line-height:1.8;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    form{
      display:flex;
      flex-direction:column;
      align-items:center;
      width:100%;
    }
    label{
      font-size:18px;
      margin:12px 0 6px;
    }
    select, textarea, input, button{
      width:100%;
      max-width:450px;
      font-size:18px;
      padding:10px;
      margin-bottom:12px;
      border-radius:5px;
      border:1px solid #ccc;
      box-sizing: border-box;
    }
    button{
      background-color:#b30000;
      color:white;
      border:none;
      cursor:pointer;
      font-weight:bold;
      padding:12px 20px;
      margin-top:10px;
    }
    button:hover{
      background-color:#990000;
    }
    .footer-text{
      text-align:center;
      margin-top:12px;
      margin-bottom:0;
      color:#ff6666;
      font-size:20px;
      font-weight:bold;
      max-width:450px;
    }
    .footer-subtext{
      text-align:center;
      color:#999999;
      font-size:14px;
      max-width:450px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <img src="Anti-harcèlement.png" alt="Logo Anti-harcèlement" onclick="window.location.reload()">
    <a href="index.html">Home</a>
    <a href="signalement.html">Signalement</a>
  </div>

  <main>
    <h1 style="text-align:center; font-size:28px;">Formulaire de signalement</h1>
    <form id="reportForm">
      <label for="type">Le harcèlement concerne :</label>
      <select id="type" required>
        <option value="moi">Moi</option>
        <option value="amis">Un ami</option>
        <option value="autre">Autre</option>
      </select>

      <label for="harassment_type">Type de harcèlement :</label>
      <select id="harassment_type" required>
        <option value="verbal">Verbal</option>
        <option value="physique">Physique</option>
        <option value="psychologique">Psychologique</option>
        <option value="cyber">Cyberharcèlement</option>
      </select>

      <label for="email">Votre email :</label>
      <input type="text" id="email" placeholder="votre.email@gmail.com" required pattern=".+@.+\..+">

      <label for="message">Description du harcèlement :</label>
      <textarea id="message" rows="6" placeholder="Décrivez brièvement ce qui se passe..." required></textarea>

      <button type="submit">Envoyer le signalement</button>
    </form>

    <p class="footer-text" id="mainFooterText">Il est interdit de donner des infos personnelles, merci à vous ! :)</p>
  </main>

  <script>
    const webhookURL = 'https://discord.com/api/webhooks/1439294598022303825/ORPf5Oq85URUXBrWn2HFQzfTUsMjn7VOvDPPh-QnEdWjtQBfpw4giiK9PTA0zzSlDSNt';

    const harassmentSelect = document.getElementById('harassment_type');
    let selectedHarassment = [];

    // Simuler multi-sélection sur une liste déroulante classique
    harassmentSelect.addEventListener('change', function() {
      const value = harassmentSelect.value;
      const index = selectedHarassment.indexOf(value);
      if(index === -1) {
        if(selectedHarassment.length >= 4){
          alert("Vous pouvez sélectionner au maximum 4 types de harcèlement !");
          harassmentSelect.value = ""; // reset dropdown
          return;
        }
        selectedHarassment.push(value);
      } else {
        selectedHarassment.splice(index, 1); // désélection
      }
      // Réafficher les choix sélectionnés comme texte dans le dropdown
      harassmentSelect.innerHTML = `
        <option disabled selected>Choisir (sélection actuelle : ${selectedHarassment.join(', ')})</option>
        <option value="verbal">Verbal</option>
        <option value="physique">Physique</option>
        <option value="psychologique">Psychologique</option>
        <option value="cyber">Cyberharcèlement</option>
      `;
    });

    document.getElementById('reportForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const type = document.getElementById('type').value;
      const harassmentType = selectedHarassment.join(', ');
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      const content = `**Type de signalement :** ${type}\n**Type de harcèlement :** ${harassmentType}\n**Email :** ${email}\n**Message :** ${message}`;

      await fetch(webhookURL, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({content})
      });

      alert('Signalement envoyé !');
      document.getElementById('reportForm').reset();
      selectedHarassment = [];
      harassmentSelect.value = "";
    });

    // Texte secondaire
    const mainFooter = document.getElementById('mainFooterText');
    const subText = document.createElement('p');
    subText.className = 'footer-subtext';
    subText.textContent = "Si cela n'est pas respecté, les signalements pourraient ne pas être pris en compte et votre confidentialité pourrait être compromise.";
    subText.style.marginTop = "10px";
    mainFooter.insertAdjacentElement('afterend', subText);
  </script>
</body>
</html>
